# Resonance build & NuGet release pipeline.
#
# Replaces two legacy definitions:
#   - the classic "Resonance Release" build pipeline (NuGetToolInstaller / NuGetCommand /
#     VSBuild / VSTest on the retired windows-2019 image)
#   - the classic "Publish Resonance Release" release pipeline (a single NuGet push task)
#
# Publishing is deliberate rather than automatic on every commit: it happens when a
# version tag is pushed, which replaces the old "create a release" step.

name: $(Date:yyyyMMdd)$(Rev:.r)

# Releases are tag driven. Pushing a v-prefixed tag builds and publishes that
# version; pushes to main only build, test and pack.
#
#     git tag v2.0.1 && git push origin v2.0.1
#
trigger:
  branches:
    include:
      - main
  tags:
    include:
      - 'v*'

pr:
  branches:
    include:
      - main

parameters:
  # Used only when the build is NOT from a tag. Tag builds take their version from
  # the tag name, so a released version always matches a commit you tagged.
  #
  # The old "Set Assembly Manifest Data" task stamped the version into each .csproj.
  # Version now lives in Directory.Build.props, so the pipeline passes it explicitly
  # via -p:Version instead.
  - name: packageVersion
    displayName: 'Package version (ignored on tag builds)'
    type: string
    default: '2.0.0'

  # Escape hatch for publishing from main without cutting a tag. Tag builds publish
  # automatically and do not need this.
  - name: publishToNuGet
    displayName: 'Push to NuGet.org (manual runs from main only)'
    type: boolean
    default: false

variables:
  buildConfiguration: 'Release'
  # Resonance.CI.slnf is Resonance.sln minus the MAUI sample, which needs the
  # maui-android workload that hosted agents do not carry by default.
  solution: 'source/Resonance.CI.slnf'

stages:
  - stage: Build
    displayName: 'Build, test & pack'
    jobs:
      - job: BuildTestPack
        displayName: 'Build / Test / Pack'
        pool:
          vmImage: 'windows-latest' # WPF examples and the test suite are Windows-only.
        steps:
          - checkout: self
            fetchDepth: 0 # Full history so SourceLink records the right commit.

          - task: UseDotNet@2
            displayName: 'Install .NET SDK (from global.json)'
            inputs:
              packageType: 'sdk'
              useGlobalJson: true

          - script: dotnet --info
            displayName: 'Show SDK info'

          # Resolved in a script rather than an expression so the log states plainly
          # which version is being built and where it came from.
          - powershell: |
              $ref = "$(Build.SourceBranch)"
              if ($ref -like 'refs/tags/v*') {
                  $version = $ref -replace '^refs/tags/v', ''
                  Write-Host "Tag build - version from tag '$ref': $version"
              }
              else {
                  $version = '${{ parameters.packageVersion }}'
                  Write-Host "Not a tag build - version from parameter: $version"
              }

              if ([string]::IsNullOrWhiteSpace($version)) {
                  Write-Host "##vso[task.logissue type=error]Could not resolve a package version."
                  exit 1
              }

              Write-Host "##vso[task.setvariable variable=packageVersion]$version"
              Write-Host "##vso[build.updatebuildnumber]$version"
            displayName: 'Resolve package version'

          - script: dotnet restore $(solution)
            displayName: 'Restore'

          - script: >
              dotnet build $(solution)
              --configuration $(buildConfiguration)
              --no-restore
              -p:Version=$(packageVersion)
            displayName: 'Build'

          # The whole suite runs - no category filtering. Tests that need real hardware
          # or a peer return early via IsRunningOnAzurePipelines and report as passed,
          # which is how this suite has always handled the CI environment.
          #
          # That flag reads TF_BUILD, which the agent sets automatically. Passing it as a
          # TestRunParameters argument instead would not survive cmd.exe quote stripping.
          #
          # console;verbosity=detailed prints each test name as it starts, so a hang is
          # visible in the live log. --blame-hang aborts and names the offending test
          # instead of running until the job timeout.
          - script: >
              dotnet test source/Resonance.Tests/Resonance.Tests.csproj
              --configuration $(buildConfiguration)
              --no-build
              --logger trx
              --logger "console;verbosity=detailed"
              --blame-hang
              --blame-hang-timeout 3m
              --results-directory $(Agent.TempDirectory)/TestResults
            displayName: 'Test'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(Agent.TempDirectory)/TestResults'
              failTaskOnFailedTests: true

          # Only the eight published libraries set IsPackable=true; everything else is
          # excluded by Directory.Build.props, so examples and tests cannot reach NuGet.
          - script: >
              dotnet pack $(solution)
              --configuration $(buildConfiguration)
              --no-build
              --output $(Build.ArtifactStagingDirectory)/nuget
              -p:Version=$(packageVersion)
            displayName: 'Pack'

          - publish: '$(Build.ArtifactStagingDirectory)/nuget'
            artifact: nuget
            displayName: 'Publish packages as pipeline artifact'

  - stage: Publish
    displayName: 'Publish to NuGet.org'
    dependsOn: Build
    # Publishes when either:
    #   - the build came from a v* tag (the normal release path), or
    #   - someone manually queued from main with the publish box ticked.
    # A plain push to main satisfies neither, so it can never publish by accident.
    condition: >
      and(
        succeeded(),
        or(
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v'),
          and(
            eq('${{ parameters.publishToNuGet }}', 'true'),
            eq(variables['Build.SourceBranch'], 'refs/heads/main')
          )
        )
      )
    jobs:
      - deployment: PushNuGet
        displayName: 'Push packages'
        pool:
          vmImage: 'windows-latest'
        # Add an approval check on this environment in Azure DevOps to require a
        # manual click before anything reaches nuget.org.
        environment: 'nuget-org'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: nuget
                  displayName: 'Download packages'

                - task: NuGetCommand@2
                  displayName: 'NuGet push'
                  inputs:
                    command: 'push'
                    packagesToPush: '$(Pipeline.Workspace)/nuget/*.nupkg'
                    nuGetFeedType: 'external'
                    # Existing service connection carried over from the old release pipeline.
                    publishFeedCredentials: 'NugetPublish'
